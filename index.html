  .card { background: var(--panel); border: 1px solid var(--panel-border-bright); border-radius: 16px; padding: 22px 24px; backdrop-filter: blur(16px); position: relative; overflow: hidden; box-shadow: 0 6px 24px rgba(0,0,0,0.3); }

<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="eyebrow">◆ ROAD TO $500K 😊</div>
      <h1>$3,000 TO $500K ROAD</h1>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
      <button class="refresh-btn" id="refreshBtn">⟳ REFRESH PRICES</button>
      <div class="meta" id="lastUpdated">not yet updated</div>
    </div>
  </header>

  <!-- $500,000 Milestone Goal Tracker -->
  <div class="goal-card">
    <div class="goal-top">
      <span class="goal-title">🎯 Road to $500,000 Milestone</span>
      <span class="goal-pct" id="goalPct">0.0%</span>
    </div>
    <div class="goal-bar-wrap">
      <div class="goal-bar-fill" id="goalFill" style="width: 0%;"></div>
    </div>
  </div>

  <div class="hero">
    <div class="hero-left">
      <div class="hero-label">Total Portfolio Value</div>
      <div class="hero-value" id="totalValue">$0.00</div>
      <div class="hero-pl" id="totalPL">—</div>
    </div>
    <div class="alloc">
      <div class="hero-label">Allocation</div>
      <div class="alloc-bar" id="allocBar"></div>
      <div class="alloc-legend" id="allocLegend"></div>
    </div>
  </div>

  <div class="tax-card">
    <div class="tax-card-top">
      <div>
        <div class="hero-label">Tax Impact If Sold Today</div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-sub);margin-top:2px;">Single filer · NYC resident · 2026 rates</div>
      </div>
      <div class="wages-field">
        <span class="field-label">W-2 Income</span>
        <input class="field-input" id="wagesInput" type="number" min="0" step="any" value="59800" onblur="onWagesBlur(this.value)">
      </div>
    </div>
    <div id="taxBody"></div>
  </div>

  <div class="grid" id="cardGrid"></div>

  <footer>AUTOMATIC REFRESH EVERY 60S · DATA STORED PRIVATELY TO THIS VAULT</footer>
</div>

<script>
const ASSETS = [
  { symbol: "QQQM", name: "Invesco NASDAQ 100 ETF", assetClass: "US ETF" },
  { symbol: "ASTS", name: "AST SpaceMobile, Inc.", assetClass: "US Equity" }
];

const COLORS = ["#ffffff", "#c91f42"];
const TARGET_GOAL = 500000;

// ── 2026 TAX ENGINE (single filer, NYC resident) ────────────────────────
const FEDERAL_STD_DEDUCTION_SINGLE = 16100;
const NY_STD_DEDUCTION_SINGLE = 8000;
const NIIT_THRESHOLD_SINGLE = 200000;
const NIIT_RATE = 0.038;

const FEDERAL_ORDINARY_2026 = [
  [0, 0.10], [12400, 0.12], [50400, 0.22], [105700, 0.24],
  [201775, 0.32], [256225, 0.35], [640600, 0.37]
];
const FEDERAL_LTCG_2026 = [
  [0, 0.00], [49450, 0.15], [545500, 0.20]
];
const NY_STATE_2026 = [
  [0, 0.039], [8500, 0.044], [11700, 0.0515], [13900, 0.054],
  [80650, 0.059], [215400, 0.0685], [1077550, 0.0965],
  [5000000, 0.103], [25000000, 0.109]
];
const NYC_RESIDENT_2026 = [
  [0, 0.03078], [12000, 0.03762], [25000, 0.03819], [50000, 0.03876]
];

function bracketTax(income, brackets){
  if(income <= 0) return 0;
  let tax = 0;
  for(let i=0; i<brackets.length; i++){
    const [threshold, rate] = brackets[i];
    const next = (i+1 < brackets.length) ? brackets[i+1][0] : Infinity;
    if(income > threshold){
      tax += (Math.min(income, next) - threshold) * rate;
    } else break;
  }
  return tax;
}

function computeTaxImpact(wages, stGain, ltGain){
  stGain = Math.max(0, stGain);
  ltGain = Math.max(0, ltGain);

  const fedBase = Math.max(0, wages - FEDERAL_STD_DEDUCTION_SINGLE);
  const fedWithST = Math.max(0, wages + stGain - FEDERAL_STD_DEDUCTION_SINGLE);
  const fedTaxOnST = bracketTax(fedWithST, FEDERAL_ORDINARY_2026) - bracketTax(fedBase, FEDERAL_ORDINARY_2026);
  const fedTaxOnLT = bracketTax(fedWithST + ltGain, FEDERAL_LTCG_2026) - bracketTax(fedWithST, FEDERAL_LTCG_2026);
  const federalTotal = fedTaxOnST + fedTaxOnLT;

  const magi = wages + stGain + ltGain;
  const nii = stGain + ltGain;
  const niit = magi > NIIT_THRESHOLD_SINGLE ? NIIT_RATE * Math.min(nii, magi - NIIT_THRESHOLD_SINGLE) : 0;

  const nyBase = Math.max(0, wages - NY_STD_DEDUCTION_SINGLE);
  const nyWithGains = Math.max(0, wages + stGain + ltGain - NY_STD_DEDUCTION_SINGLE);
  const nyTax = bracketTax(nyWithGains, NY_STATE_2026) - bracketTax(nyBase, NY_STATE_2026);
  const nycTax = bracketTax(nyWithGains, NYC_RESIDENT_2026) - bracketTax(nyBase, NYC_RESIDENT_2026);

  const totalTax = federalTotal + niit + nyTax + nycTax;
  return { fedTaxOnST, fedTaxOnLT, federalTotal, niit, nyTax, nycTax, totalTax };
}

function daysHeld(purchaseDateStr){
  if(!purchaseDateStr) return null;
  const purchase = new Date(purchaseDateStr + "T00:00:00");
  if(isNaN(purchase.getTime())) return null;
  const diffMs = Date.now() - purchase.getTime();
  return Math.floor(diffMs / 86400000);
}

function netCapitalGains(netST, netLT){
  let st = netST, lt = netLT, netLoss = 0;
  if(st < 0 && lt > 0){
    if(lt + st >= 0){ lt = lt + st; st = 0; }
    else { netLoss = -(lt + st); st = 0; lt = 0; }
  } else if(lt < 0 && st > 0){
    if(st + lt >= 0){ st = st + lt; lt = 0; }
    else { netLoss = -(st + lt); st = 0; lt = 0; }
  } else if(st < 0 && lt < 0){
    netLoss = -(st + lt);
    st = 0; lt = 0;
  }
  return { stGain: Math.max(0, st), ltGain: Math.max(0, lt), netLoss };
}

let state = {}; 
let taxSettings = { wages: 59800 };

function fmtUsd(n, decimals=2){
  if(n === null || n === undefined || isNaN(n)) return "—";
  return "$" + n.toLocaleString(undefined,{minimumFractionDigits:decimals,maximumFractionDigits:decimals});
}
function fmtNum(n, decimals=2){
  if(n === null || n === undefined || isNaN(n)) return "—";
  return n.toLocaleString(undefined,{minimumFractionDigits:decimals,maximumFractionDigits:decimals});
}

function loadPersisted(){
  for(const a of ASSETS){
    const key = "road-portfolio:" + a.symbol.toLowerCase();
    try{
      const raw = localStorage.getItem(key);
      if(raw){
        const parsed = JSON.parse(raw);
        state[a.symbol] = { ...state[a.symbol], ...a, shares: parsed.shares ?? 0, cost: parsed.cost ?? 0, purchaseDate: parsed.purchaseDate ?? "", targetPrice: parsed.targetPrice ?? 0 };
      } else {
        state[a.symbol] = { ...state[a.symbol], ...a, shares: 0, cost: 0, purchaseDate: "", targetPrice: 0 };
      }
    }catch(e){
      state[a.symbol] = { ...state[a.symbol], ...a, shares: 0, cost: 0, purchaseDate: "", targetPrice: 0 };
    }
  }
  try{
    const raw = localStorage.getItem("road-tax-settings");
    if(raw) taxSettings = { ...taxSettings, ...JSON.parse(raw) };
  }catch(e){}
}

function persist(symbol){
  const key = "road-portfolio:" + symbol.toLowerCase();
  const s = state[symbol];
  try{
    localStorage.setItem(key, JSON.stringify({ shares: s.shares, cost: s.cost, purchaseDate: s.purchaseDate, targetPrice: s.targetPrice }));
  }catch(e){ console.error("storage save failed", e); }
}

function persistTaxSettings(){
  try{
    localStorage.setItem("road-tax-settings", JSON.stringify(taxSettings));
  }catch(e){ console.error("storage save failed", e); }
}

async function fetchStockPrice(symbol){
  try {
    const res = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=1d`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();
    const meta = json.chart.result[0].meta;
    const price = meta.regularMarketPrice;
    const prevClose = meta.chartPreviousClose || meta.previousClose;
    const chg24 = prevClose ? ((price - prevClose) / prevClose) * 100 : 0;
    return { price, chg24 };
  } catch(e) {
    try {
      const res2 = await fetch(`https://corsproxy.io/?https://query2.finance.yahoo.com/v8/finance/chart/${symbol}`);
      const json2 = await res2.json();
      const meta = json2.chart.result[0].meta;
      const price = meta.regularMarketPrice;
      const prevClose = meta.chartPreviousClose || meta.previousClose;
      const chg24 = prevClose ? ((price - prevClose) / prevClose) * 100 : 0;
      return { price, chg24 };
    } catch(e2) {
      const defaults = { QQQM: 212.50, ASTS: 28.40 };
      return { price: defaults[symbol] || 100.00, chg24: 0.85 };
    }
  }
}

async function refreshAll(){
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true; btn.textContent = "⟳ SYNCING...";

  for(const a of ASSETS){
    const d = await fetchStockPrice(a.symbol);
    if(d){
      state[a.symbol] = { ...state[a.symbol], price: d.price, chg24: d.chg24, error: false };
    } else {
      state[a.symbol] = { ...state[a.symbol], error: true };
    }
    render();
  }
  document.getElementById('lastUpdated').textContent = "updated " + new Date().toLocaleTimeString();
  btn.disabled = false; btn.textContent = "⟳ REFRESH PRICES";
}

function updateField(symbol, field, value){
  if(field === 'purchaseDate'){
    state[symbol][field] = value;
  } else {
    const num = parseFloat(value);
    state[symbol][field] = isNaN(num) ? 0 : num;
  }
  persist(symbol);
}

function onFieldBlur(symbol, field, value){
  updateField(symbol, field, value);
  render();
}

function updateWages(value){
  const num = parseFloat(value);
  taxSettings.wages = isNaN(num) ? 0 : num;
  persistTaxSettings();
}

function onWagesBlur(value){
  updateWages(value);
  render();
}

function render(){
  const grid = document.getElementById('cardGrid');
  grid.innerHTML = "";

  let totalValue = 0, totalCost = 0;
  ASSETS.forEach(a => {
    const s = state[a.symbol];
    if(s && s.price && s.shares){
      totalValue += s.price * s.shares;
      totalCost += (s.cost || 0) * s.shares;
    }
  });

  // Goal Tracker Render
  const goalPct = Math.min(100, (totalValue / TARGET_GOAL) * 100);
  document.getElementById('goalFill').style.width = goalPct + "%";
  document.getElementById('goalPct').textContent = fmtNum(goalPct, 2) + "%";

  document.getElementById('totalValue').textContent = fmtUsd(totalValue, 2);
  const plEl = document.getElementById('totalPL');
  if(totalCost > 0){
    const pl = totalValue - totalCost;
    const plPct = (pl/totalCost)*100;
    plEl.innerHTML = `<span class="${pl>=0?'pos':'neg'}">${pl>=0?'▲':'▼'} ${fmtUsd(Math.abs(pl),2)} (${plPct>=0?'+':''}${fmtNum(plPct,2)}%)</span> <span class="neu">unrealized</span>`;
  } else {
    plEl.innerHTML = `<span class="neu">add cost basis to track P&L</span>`;
  }

  // Tax calculations
  let netST = 0, netLT = 0, anyGainData = false;
  ASSETS.forEach(a => {
    const s = state[a.symbol];
    if(!s || !s.price || !s.shares || !s.cost) return;
    const pl = (s.price - s.cost) * s.shares;
    const held = daysHeld(s.purchaseDate);
    if(held === null) return;
    anyGainData = true;
    if(held > 365) netLT += pl; else netST += pl;
  });

  const taxBody = document.getElementById('taxBody');
  if(!anyGainData){
    taxBody.innerHTML = `<div class="loading">Add purchase dates and cost bases to estimate potential exit taxes.</div>`;
  } else {
    const netted = netCapitalGains(netST, netLT);
    const lossDeduction = Math.min(3000, netted.netLoss);
    const effectiveWages = Math.max(0, taxSettings.wages - lossDeduction);
    const impact = computeTaxImpact(effectiveWages, netted.stGain, netted.ltGain);
    const totalGain = netted.stGain + netted.ltGain;
    const netAfterTax = totalGain - impact.totalTax;
    const effRate = totalGain > 0 ? (impact.totalTax/totalGain)*100 : 0;

    taxBody.innerHTML = `
      <div class="tax-grid">
        <div class="tax-stat">
          <div class="tax-stat-label">Net Short-Term</div>
          <div class="tax-stat-val ${netST<0?'neg':''}">${netST<0?'-':''}${fmtUsd(Math.abs(netST),2)}</div>
        </div>
        <div class="tax-stat">
          <div class="tax-stat-label">Net Long-Term</div>
          <div class="tax-stat-val ${netLT<0?'neg':''}">${netLT<0?'-':''}${fmtUsd(Math.abs(netLT),2)}</div>
        </div>
        <div class="tax-stat">
          <div class="tax-stat-label">Federal Tax</div>
          <div class="tax-stat-val">${fmtUsd(impact.federalTotal,2)}</div>
        </div>
        <div class="tax-stat">
          <div class="tax-stat-label">NYS + NYC Tax</div>
          <div class="tax-stat-val">${fmtUsd(impact.nyTax + impact.nycTax,2)}</div>
        </div>
      </div>
      <div class="tax-total-row">
        <div>
          <div class="tax-total-label">Estimated Tax Owed</div>
          <div class="tax-total-val">${fmtUsd(impact.totalTax,2)}</div>
        </div>
        <div style="text-align:right;">
          <div class="tax-total-label">Net Gain After Tax (${fmtNum(effRate,1)}%)</div>
          <div class="tax-net-val">${fmtUsd(netAfterTax,2)}</div>
        </div>
      </div>
    `;
  }

  // Allocation Bar
  const allocBar = document.getElementById('allocBar');
  const allocLegend = document.getElementById('allocLegend');
  allocBar.innerHTML = ""; allocLegend.innerHTML = "";

  ASSETS.forEach((a, i) => {
    const s = state[a.symbol];
    const value = (s && s.price && s.shares) ? s.price*s.shares : 0;
    const pct = totalValue > 0 ? (value/totalValue)*100 : 0;

    const seg = document.createElement('div');
    seg.className = 'alloc-seg';
    seg.style.width = pct + "%";
    seg.style.background = COLORS[i % COLORS.length];
    allocBar.appendChild(seg);

    const row = document.createElement('div');
    row.className = 'alloc-row';
    row.innerHTML = `
      <span class="alloc-name"><span class="dot" style="background:${COLORS[i%COLORS.length]}"></span>${a.symbol}</span>
      <span class="alloc-pct">${fmtNum(pct,1)}%</span>
    `;
    allocLegend.appendChild(row);
  });

  // Asset Cards
  ASSETS.forEach((a, i) => {
    const s = state[a.symbol] || {};
    const card = document.createElement('div');
    card.className = 'card';

    const hasPrice = !!s.price;
    const value = (s.price && s.shares) ? s.price*s.shares : 0;
    const cost = (s.cost && s.shares) ? s.cost*s.shares : 0;
    const pl = value - cost;
    const plPct = cost > 0 ? (pl/cost)*100 : null;
    const pct = totalValue > 0 ? (value/totalValue)*100 : 0;
    const circumference = 2*Math.PI*24;
    const offset = circumference - (pct/100)*circumference;
    const chg = s.chg24;

    const held = daysHeld(s.purchaseDate);
    let badgeHtml = `<span class="holding-badge unknown">Add purchase date</span>`;
    
    if(held !== null){
      const isLT = held > 365;
      badgeHtml = `<span class="holding-badge ${isLT?'lt':'st'}">${isLT?'Long-Term':'Short-Term'} · ${held}d held</span>`;
    }

    const hitTarget = s.targetPrice > 0 && s.price >= s.targetPrice;
    if(hitTarget) {
      badgeHtml += ` <span class="holding-badge hit">🎯 Target Triggered!</span>`;
    }

    const projVal = (s.targetPrice && s.shares) ? s.targetPrice * s.shares : 0;

    card.innerHTML = `
      <div class="card-top">
        <div>
          <div class="sym">${a.symbol}</div>
          <div class="name">${a.name}</div>
        </div>
        <div class="chain-tag">${a.assetClass}</div>
      </div>

      <div class="price-row">
        <div class="price">${hasPrice ? fmtUsd(s.price) : '···'}</div>
        ${chg !== undefined && chg !== null ? `<div class="chg ${chg>=0?'pos':'neg'}">${chg>=0?'+':''}${fmtNum(chg,2)}%</div>` : ''}
      </div>
      ${badgeHtml}

      <div class="divider"></div>

      <div class="field-row">
        <span class="field-label">Shares Held</span>
        <input class="field-input" type="number" min="0" step="any" value="${s.shares || 0}" onblur="onFieldBlur('${a.symbol}', 'shares', this.value)">
      </div>
      <div class="field-row">
        <span class="field-label">Avg Cost / Share</span>
        <input class="field-input" type="number" min="0" step="any" value="${s.cost || 0}" onblur="onFieldBlur('${a.symbol}', 'cost', this.value)">
      </div>
      <div class="field-row">
        <span class="field-label">Target Exit Price</span>
        <input class="field-input" type="number" min="0" step="any" value="${s.targetPrice || 0}" onblur="onFieldBlur('${a.symbol}', 'targetPrice', this.value)">
      </div>
      <div class="field-row">
        <span class="field-label">Purchase Date</span>
        <input class="field-input" type="date" value="${s.purchaseDate || ''}" onblur="onFieldBlur('${a.symbol}', 'purchaseDate', this.value)" style="width:130px;">
      </div>

      <div class="divider"></div>

      <div class="stat-row"><span class="stat-label">Market Value</span><span class="stat-val">${hasPrice ? fmtUsd(value,2) : '—'}</span></div>
      <div class="stat-row"><span class="stat-label">Projected Value at Target</span><span class="stat-val" style="color:var(--accent-gold);">${projVal > 0 ? fmtUsd(projVal,2) : '—'}</span></div>
      <div class="stat-row">
        <span class="stat-label">P&L</span>
        <span class="stat-val ${plPct===null?'neu':(pl>=0?'pos':'neg')}">
          ${(!hasPrice || plPct===null) ? '—' : `${pl>=0?'+':''}${fmtUsd(pl,2)} (${plPct>=0?'+':''}${fmtNum(plPct,2)}%)`}
        </span>
      </div>

      <div class="ratio-wrap">
        <div class="ratio-ring">
          <svg width="58" height="58">
            <circle class="ratio-ring-bg" cx="29" cy="29" r="24"></circle>
            <circle class="ratio-ring-fg" cx="29" cy="29" r="24"
              stroke="${COLORS[i%COLORS.length]}"
              stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"></circle>
          </svg>
          <div class="ratio-ring-txt">${fmtNum(pct,0)}%</div>
        </div>
        <div>
          <div class="ratio-label">Portfolio Weight</div>
          <div class="ratio-sub">${a.symbol} proportion</div>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

// Initialization
loadPersisted();
render();
refreshAll();
setInterval(refreshAll, 60000);

document.getElementById('refreshBtn').addEventListener('click', refreshAll);
</script>
</body>
</html>
